<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fundación Unidad Sebastián de Vida — Fe que transforma</title>
  <!-- Lo que Google muestra bajo el título: con palabras que la gente busca, ≤ 160 caracteres -->
  <meta name="description" content="Fundación sin ánimo de lucro en Córdoba, Colombia. Acompañamos a familias del Caribe colombiano en salud mental, nutrición infantil, adulto mayor, deporte y más.">

  <link rel="canonical" href="https://fundacionusv.org/">

  <!-- Ficha para buscadores: le dice a Google que es una ONG, dónde está y cómo contactarla -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NGO",
    "name": "Fundación Unidad Sebastián de Vida",
    "alternateName": "Fundación USV",
    "url": "https://fundacionusv.org/",
    "logo": "https://fundacionusv.org/img/logo.png",
    "slogan": "Fe que transforma",
    "description": "Fundación sin ánimo de lucro en Córdoba, Colombia, que acompaña a familias del Caribe colombiano.",
    "email": "fundacionusv@gmail.com",
    "telephone": "+57 310 353 8881",
    "address": { "@type": "PostalAddress", "addressRegion": "Córdoba", "addressCountry": "CO" },
    "areaServed": "Caribe colombiano",
    "knowsAbout": [
      "Empoderamiento económico y social", "Bienestar emocional y salud mental",
      "Juventud con propósito", "Enfermedades huérfanas y discapacidad",
      "Conciencia ambiental y sostenibilidad", "Cuidado del joven y del adolescente",
      "Prevención de la desnutrición infantil", "Cuidado del adulto mayor", "Deporte",
      "Educación sexual y reproductiva", "Tamizajes de cáncer", "Hábitos de vida saludable"
    ],
    "sameAs": ["https://www.instagram.com/unidadsebastiandevida"]
  }
  </script>

  <!-- Al compartir el enlace (WhatsApp, Facebook). og:image exige URL absoluta. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fundación Unidad Sebastián de Vida">
  <meta name="twitter:card" content="summary">
  <meta property="og:url" content="https://fundacionusv.org/">
  <meta property="og:image" content="https://fundacionusv.org/img/logo.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:locale" content="es_CO">
  <meta property="og:title" content="Fundación Unidad Sebastián de Vida — Fe que transforma">
  <meta property="og:description" content="Desde el corazón del Caribe colombiano trabajamos para encender la luz donde otros ven dificultad y sembrar vida donde más se necesita.">

  <!-- Iconos (círculo recortado del logo) -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="img/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2B381A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fundación USV">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Montserrat:wght@400;500;600;700;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <a class="saltar" href="#contenido" @click.prevent="saltarAlContenido">Saltar al contenido</a>

  <!-- ============ HEADER + NAV ============ -->
  <header class="site-header sticky-top">
    <nav class="navbar navbar-expand-lg py-2">
      <div class="container">

        <router-link class="navbar-brand d-flex align-items-center gap-2 gap-md-3" to="/">
          <img src="img/logo.png" alt="Logo Fundación Unidad Sebastián de Vida" class="brand-logo">
          <span class="brand-text">
            <span class="brand-line-1">Fundación Unidad</span>
            <span class="brand-line-2">Sebastián de Vida</span>
          </span>
        </router-link>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
            <li class="nav-item"><router-link class="nav-link" to="/">Inicio</router-link></li>
            <li class="nav-item"><router-link class="nav-link" to="/nosotros">Nosotros</router-link></li>
            <li class="nav-item"><router-link class="nav-link" to="/ejes">Ejes</router-link></li>
            <li class="nav-item"><router-link class="nav-link" to="/galeria">Galería</router-link></li>
            <li class="nav-item mt-2 mt-lg-0 ms-lg-2">
              <router-link class="btn btn-brand" to="/contacto">Contáctanos</router-link>
            </li>
          </ul>
        </div>

      </div>
    </nav>
  </header>

  <!-- ============ VISTA ACTIVA ============ -->
  <main id="contenido" tabindex="-1">
    <router-view v-slot="{ Component }">
      <transition name="fade" mode="out-in">
        <component :is="Component"></component>
      </transition>
    </router-view>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-top">
        <img src="img/logo.png" alt="Logo Fundación Unidad Sebastián de Vida" class="footer-logo">
        <p class="footer-motto">Fe que transforma</p>
      </div>
      <hr class="footer-rule">
      <p class="footer-copy">
        © {{ anio }} Fundación Unidad Sebastián de Vida. Todos los derechos reservados.
      </p>
    </div>
  </footer>

  <!-- Botón de instalación: solo aparece si el navegador la ofrece -->
  <button class="btn-instalar" v-if="puedeInstalar" @click="instalar">
    <span aria-hidden="true">⇩</span> Instalar app
  </button>

</div>

<!-- Librerías (CDN, sin build) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue-router@4.4.3/dist/vue-router.global.prod.js"></script>

<!-- Vistas: cada archivo define un componente global -->
<script src="js/views/inicio.js"></script>
<script src="js/views/nosotros.js"></script>
<script src="js/views/ejes.js"></script>
<!-- Datos y clasificacion de la galeria por eje (debe ir antes de galeria.js) -->
<script src="js/ejes-galeria.js"></script>
<script src="js/views/galeria.js"></script>
<script src="js/views/contacto.js"></script>

<!-- Router + arranque -->
<script src="js/app.js"></script>
</body>
</html>
